apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: sandboxtemplate-containers-tag
spec:
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: actor
        image: gcr.io/team/actor:1.0
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
