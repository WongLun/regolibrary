apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: sandbox-containers-no-cpu
spec:
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: actor
        image: gcr.io/team/actor@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        resources:
          limits:
            memory: 256Mi
