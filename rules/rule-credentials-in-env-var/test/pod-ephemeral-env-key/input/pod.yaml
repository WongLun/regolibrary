apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-key-pod
  labels:
    app: ephemeral-key-pod
spec:
  containers:
  - name: main
    image: nginx:1.25
  ephemeralContainers:
  - name: debug
    image: busybox:1.36.1
    env:
    - name: random
      value: "hello"
    - name: azure_batch_key
      value: "my-secret-value"
