apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: sandboxtemplate-containers-local
spec:
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: actor
        image: localhost/nginx
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
