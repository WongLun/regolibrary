apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: sandbox-containers-evil
spec:
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: actor
        image: gcr.io.evil/actor
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
